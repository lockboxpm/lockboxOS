services:
  app:
    image: lockboxpm:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GEMINI_API_KEY: ${GEMINI_API_KEY}
        STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
        PRINTFUL_STORE_ID: ${PRINTFUL_STORE_ID:-17464534}
    container_name: lockboxpm-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
    networks:
      - default
      - coolify
    labels:
      - caddy=lockboxpm.com, www.lockboxpm.com
      - caddy.reverse_proxy={{upstreams 3000}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: lockboxpm_net
  coolify:
    external: true
